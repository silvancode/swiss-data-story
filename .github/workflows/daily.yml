name: Daily Swiss Data Story MVP

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fruehere run_report.json-Dateien wiederherstellen, damit die
      # Neuheitspruefung (src/history.py) auch in CI aehnliche Stories erkennt.
      - name: Restore story history
        uses: actions/cache/restore@v4
        with:
          path: outputs/
          key: story-history-${{ github.run_id }}
          restore-keys: story-history-

      - name: Run pipeline
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'none' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python -m src.main

      - name: Save story history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: outputs/
          key: story-history-${{ github.run_id }}

      - name: Upload story artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-data-story-${{ github.run_id }}
          path: outputs/
