[project]
name = "swiss-data-story"
version = "0.1.0"
description = "Findet täglich ein aktuelles Schweizer Thema, sucht passende offene Daten auf opendata.swiss und erzeugt daraus eine Grafik mit Begleittext."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B905"]
